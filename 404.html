<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nie znaleziono strony — Królowa Przedmieścia</title>
<meta name="robots" content="noindex,follow" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='24' fill='%238B2A1C'/%3E%3Cpath d='M6 18 L11 31 L16 21 L24 33 L32 21 L37 31 L42 18' fill='none' stroke='%23F5E2A8' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,400;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDE3CF; --bg-2: #E2D5BC; --ink: #4A1A12; --muted: #8A6F5F;
    --line: rgba(74,26,18,0.16); --accent: #8B2A1C; --cream: #F5E2A8;
    --sans: "Inter", system-ui, sans-serif;
    --serif: "Playfair Display", serif;
    --mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background-image:
      repeating-linear-gradient(45deg, transparent 0 18px, color-mix(in oklab, var(--accent) 4%, transparent) 18px 19px);
  }
  ::selection { background: var(--ink); color: var(--bg); }
  .wrap { text-align: center; max-width: 560px; }
  .code {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted); display: flex; align-items: center;
    justify-content: center; gap: 12px; margin-bottom: 28px;
  }
  .code::before, .code::after {
    content: ""; width: 28px; height: 1px; background: currentColor;
  }
  h1 {
    font-family: var(--serif); font-style: italic;
    font-size: clamp(64px, 16vw, 140px);
    font-weight: 800; letter-spacing: -0.04em;
    line-height: 0.92; margin: 0 0 16px;
  }
  .accent { color: var(--accent); }
  .lede {
    font-family: var(--serif); font-style: italic;
    font-size: clamp(20px, 3.5vw, 26px); font-weight: 500;
    line-height: 1.3; max-width: 460px; margin: 0 auto 12px;
  }
  .sub {
    font-size: 15px; color: var(--muted);
    line-height: 1.6; max-width: 420px; margin: 0 auto 36px;
  }
  .actions { display: inline-flex; flex-direction: column; gap: 10px; }
  @media (min-width: 480px) { .actions { flex-direction: row; gap: 12px; } }
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: var(--sans); font-size: 15px; font-weight: 600;
    padding: 14px 22px; border-radius: 999px;
    text-decoration: none; display: inline-flex;
    align-items: center; justify-content: center;
    transition: transform 200ms ease, background 200ms ease;
  }
  .btn-primary { background: var(--accent); color: var(--cream); }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-secondary {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-secondary:hover { background: color-mix(in oklab, var(--ink) 6%, transparent); }
  .monogram {
    width: 64px; height: 64px; margin: 0 auto 24px;
    background: var(--accent); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="monogram">
      <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
        <path d="M4 18 L10 34 L16 22 L24 34 L32 22 L38 34 L44 18" fill="none" stroke="#F5E2A8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <div class="code">błąd 404</div>

    <h1>Tu nikt<br/>nie parzy<span class="accent">.</span></h1>

    <p class="lede">Strona zniknęła jak ostatnia drożdżówka o 9:30.</p>

    <p class="sub">
      Może literówka w adresie? A może po prostu wpadnij do nas na kawę i porozmawiamy o tym przy stoliku.
    </p>

    <div class="actions">
      <a href="index.html" class="btn btn-primary">Wróć na stronę główną →</a>
      <a href="index.html#visit" class="btn btn-secondary">Gdzie jesteśmy?</a>
    </div>
  </main>
</body>
</html>

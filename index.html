function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title, children }) {
  return <><div className="twk-sect">{title}</div>{children}</>;
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakToggle({ label, tweaks, setTweak, tweakKey }) {
  const value = tweaks[tweakKey];
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => setTweak(tweakKey, !value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, tweaks, setTweak, tweakKey, options }) {
  const value = tweaks[tweakKey];
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (
    <TweakRow label={label}>
      <div role="radiogroup" style={{ position:'relative', display:'flex', padding:2, borderRadius:8, background:'rgba(0,0,0,.06)', userSelect:'none' }}>
        <div style={{ position:'absolute', top:2, bottom:2, borderRadius:6, background:'rgba(255,255,255,.9)', boxShadow:'0 1px 2px rgba(0,0,0,.12)', transition:'left .15s, width .15s', left:`calc(2px + ${idx} * (100% - 4px) / ${n})`, width:`calc((100% - 4px) / ${n})` }} />
        {opts.map(o => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}
                  onClick={() => setTweak(tweakKey, o.value)}
                  style={{ appearance:'none', position:'relative', zIndex:1, flex:1, border:0, background:'transparent', color:'inherit', fontFamily:'inherit', fontSize:'inherit', fontWeight:500, minHeight:22, borderRadius:6, cursor:'default', padding:'4px 6px', lineHeight:1.2 }}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, tweaks, setTweak, tweakKey, options }) {
  const value = tweaks[tweakKey];
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={e => setTweak(tweakKey, e.target.value)}>
        {options.map(o => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakToggle, TweakRadio, TweakSelect });

// ─── helpers ──────────────────────────────────────────────────────────────────

function Monogram({ size = 38, fg = "currentColor", bg = "transparent", style: extraStyle }) {
  return (
    <div style={{ width: size, height: size, borderRadius: "50%", background: bg, display: "inline-flex", alignItems: "center", justifyContent: "center", flex: "0 0 auto", ...extraStyle }}>
      <svg viewBox="0 0 48 48" width={size * 0.62} height={size * 0.62} aria-hidden="true">
        <path d="M4 18 L10 34 L16 22 L24 34 L32 22 L38 34 L44 18" fill="none" stroke={fg} strokeWidth="3.4" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    </div>
  );
}

function Eyebrow({ children }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14, fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "var(--muted)" }}>
      <span style={{ width: 28, height: 1, background: "currentColor", flex: "0 0 auto" }} />
      <span>{children}</span>
    </div>
  );
}

function Stars({ n = 5, size = 16, color = "#E5A12B" }) {
  return (
    <div style={{ display: "inline-flex", gap: 2 }} aria-label={`${n} z 5 gwiazdek`}>
      {Array.from({ length: 5 }).map((_, i) => (
        <svg key={i} width={size} height={size} viewBox="0 0 20 20" fill={i < n ? color : "transparent"} stroke={color} strokeWidth="1.4">

        </svg>
      ))}
    </div>
  );
}

function StorefrontPhoto() {
  // Show photo only if upload succeeds — no placeholder, no broken-image icon.
  const [ok, setOk] = useState(null); // null = probing, true = loaded, false = missing
  useEffect(() => {
    const probe = new Image();
    probe.onload  = () => setOk(true);
    probe.onerror = () => setOk(false);
    probe.src = "project/uploads/storefront.webp";
  }, []);
  if (ok !== true) return null;
  return (
    <div className="storefront-wrap">
      <img src="project/uploads/storefront.webp"

function BackToTop() {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const onScroll = () => setVisible(window.scrollY > 800);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <button
      onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
      className="back-to-top"
      data-hidden={visible ? "0" : "1"}
      aria-label="Wróć na górę strony"
      title="Wróć na górę"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <polyline points="18 15 12 9 6 15" />
      </svg>
    </button>
  );
}

// ─── sticky mobile CTA ────────────────────────────────────────────────────────

function StickyMobileCTA({ active, onJump }) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const onScroll = () => setVisible(window.scrollY > 600);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const hide = !visible || active === "visit";
  return (
    <div className="sticky-cta" data-hidden={hide ? "1" : "0"} aria-hidden={hide}>
      <a href="tel:+48123456789" className="sticky-cta-link sticky-cta-secondary" aria-label="Zadzwoń">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
        </svg>
      </a>
      <button onClick={() => onJump("visit")} className="sticky-cta-link sticky-cta-primary">
        Wpadnij →
      </button>
    </div>
  );
}

// ─── RODO cookie banner ───────────────────────────────────────────────────────

function CookieBanner() {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    try {
      const v = localStorage.getItem("kp-cookies");
      if (!v) setOpen(true);
    } catch (e) { setOpen(true); }
  }, []);
  const close = (choice) => {
    try { localStorage.setItem("kp-cookies", choice); } catch (e) {}
    setOpen(false);
  };
  if (!open) return null;
  return (
    <div className="cookie-banner" role="dialog" aria-labelledby="cookie-title">
      <div className="cookie-body">
        <div id="cookie-title" style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 18, fontWeight: 600, color: "var(--ink)", lineHeight: 1.2 }}>Plik cookie i tyle.</div>
        <p style={{ margin: "8px 0 0", fontSize: 13, lineHeight: 1.5, color: "var(--muted)" }}>
          Używamy niezbędnych plików cookie, żeby strona działała poprawnie. Pomijamy reklamowe i analityczne — chyba że zaakceptujesz.{" "}
          <a href="polityka-prywatnosci.html" style={{ color: "var(--accent)", textDecoration: "underline" }}>Polityka prywatności</a>
        </p>
      </div>
      <div className="cookie-actions">
        <button onClick={() => close("rejected")} className="cookie-btn cookie-btn-secondary">Tylko niezbędne</button>
        <button onClick={() => close("accepted")} className="cookie-btn cookie-btn-primary">Akceptuję wszystkie</button>
      </div>
    </div>
  );
}

          appearance: none; border: 0; cursor: pointer;
          display: inline-flex; align-items: center; justify-content: center;
          font-family: var(--sans); font-weight: 600; font-size: 14px;
          border-radius: 999px;
          transition: background 200ms ease, transform 200ms ease;
          text-decoration: none;
        }
        .sticky-cta-primary { flex: 1; background: var(--accent); color: var(--cream); padding: 13px 18px; }
        .sticky-cta-secondary { background: color-mix(in oklab, var(--cream) 18%, transparent); color: var(--cream); width: 44px; height: 44px; flex: 0 0 auto; }
        .sticky-cta-secondary:hover { background: color-mix(in oklab, var(--cream) 28%, transparent); }
        .sticky-cta-primary:hover { transform: translateY(-1px); }

        /* ── cookie banner ── */
        .cookie-banner {
          position: fixed; left: 16px; right: 16px; bottom: 16px;
          z-index: 60;
          max-width: 480px;
          background: color-mix(in oklab, var(--bg) 70%, white 30%);
          border: 1px solid var(--line);
          border-radius: 16px;
          padding: 18px 18px 16px;
          box-shadow: 0 20px 40px -16px rgba(74,26,18,0.25), 0 6px 12px rgba(74,26,18,0.10);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
        }
        @media (min-width: 768px) { .cookie-banner { left: auto; right: 24px; bottom: 24px; } }
        @media (max-width: 767px) { .cookie-banner { bottom: 80px; /* leave room for sticky CTA */ } }
        .cookie-body { margin-bottom: 14px; }
        .cookie-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .cookie-btn {
          appearance: none; cursor: pointer;
          font-family: var(--sans); font-size: 13px; font-weight: 600;
          padding: 10px 14px; border-radius: 999px;
          transition: background 180ms ease, transform 180ms ease;
          flex: 1; min-width: 0;
        }
        .cookie-btn-primary { background: var(--accent); color: var(--cream); border: 0; }
        .cookie-btn-primary:hover { transform: translateY(-1px); }
        .cookie-btn-secondary {
          background: transparent;
          color: var(--ink);
          border: 1px solid var(--line);
        }
        .cookie-btn-secondary:hover { background: color-mix(in oklab, var(--ink) 6%, transparent); }
      `}</style>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
// Hide pre-React loading skeleton once the first render commits.
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("app-ready")));
  </script>
</body>
